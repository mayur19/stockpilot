        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '501': { $ref: '#/components/responses/NotImplemented' }

  # ---------------------------------------------------------------- Allocation
  /api/v1/allocations:
    get:
      tags: [Allocation]
      operationId: listAllocations
      summary: List allocations of a warehouse, newest first
      x-status: implemented
      x-ticket: SP-051
      x-permission: allocation:read
      parameters:
        - $ref: '#/components/parameters/WarehouseIdQuery'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Allocation headers (without lines).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      {
                        data:
                          { type: array, items: { $ref: '#/components/schemas/AllocationHeader' } },
                      }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Allocation]
      operationId: createAllocation
      summary: Allocate an order against available stock
      description: >-
        In one transaction: lock every candidate balance row for the requested SKUs
        (ordered by SKU then row id, `FOR UPDATE`), plan in pure code with the chosen
        strategy (request `strategy` overrides each SKU's `defaultStrategy`), persist
        lines and picks, and append one `ALLOCATE` ledger entry per pick. Only bins in
        active STORAGE or PICK zones are candidates; expired, held and short-shelf-life
        lots are excluded. With `shipComplete=false` a partial result is stored with
        status `PARTIAL`; when nothing (or, with `shipComplete=true`, not everything)
        can be allocated the request fails with `409 INSUFFICIENT_STOCK`. A second live
        allocation for the same `orderRef` in the warehouse answers `409 ALREADY_EXISTS`.
      x-status: implemented
      x-ticket: SP-051
      x-permission: allocation:write
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AllocationRequest' }
      responses:
        '201':
          description: Allocation created (status ALLOCATED or PARTIAL).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties: { data: { $ref: '#/components/schemas/Allocation' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`INSUFFICIENT_STOCK` (details.lines carry per-line shortfall) or `ALREADY_EXISTS`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
                insufficient:
                  value:
                    data: null
                    error:
                      code: INSUFFICIENT_STOCK
                      message: Not enough eligible stock to allocate this order
                      details:
                        lines:
                          - {
                              lineNo: 1,
                              skuId: 3f0c6c1e-6a43-4c55-9d1f-5a1f0b8b2a10,
                              requested: 60,
                              shortfall: 21,
                              excluded: 2,
                            }
        '503': { $ref: '#/components/responses/ConcurrencyRetry' }
  /api/v1/allocations/{allocationId}:
    get:
      tags: [Allocation]
      operationId: getAllocation
      summary: Get an allocation with lines and picks
      x-status: implemented
      x-ticket: SP-051
      x-permission: allocation:read
      parameters:
        - $ref: '#/components/parameters/AllocationIdPath'
      responses:
        '200':
          description: The allocation; picks are ordered by bin walk sequence.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties: { data: { $ref: '#/components/schemas/Allocation' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/allocations/{allocationId}/release:
    post:
      tags: [Allocation]
      operationId: releaseAllocation
      summary: Release an allocation (compensating DEALLOCATE entries)
      description: >-
        Returns every reserved unit to available stock by appending one `DEALLOCATE`
        movement per pick and marks the allocation `RELEASED`. A second release answers
        `409 ALREADY_RELEASED`. No request body is needed.
      x-status: implemented
      x-ticket: SP-055
      x-permission: allocation:write
      parameters:
        - $ref: '#/components/parameters/AllocationIdPath'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Released allocation.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties: { data: { $ref: '#/components/schemas/Allocation' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ConcurrencyRetry' }

