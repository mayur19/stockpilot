          description: Rules.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      {
                        data:
                          {
                            type: array,
                            items: { $ref: '#/components/schemas/ReplenishmentRule' },
                          },
                      }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '501': { $ref: '#/components/responses/NotImplemented' }
  /api/v1/replenishment/run:
