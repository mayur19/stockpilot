        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRmaRequest' }
      responses:
        '201':
          description: RMA authorised.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties: { data: { $ref: '#/components/schemas/Rma' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '501': { $ref: '#/components/responses/NotImplemented' }
  /api/v1/rmas/{rmaId}/receipts:
    post:
      tags: [Returns]
      operationId: receiveReturn
      summary: Receive returned items and record their disposition
      x-status: pending
      x-ticket: SP-151
      x-permission: authenticated
      parameters:
        - $ref: '#/components/parameters/RmaIdPath'
