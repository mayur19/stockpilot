          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties: { data: { $ref: '#/components/schemas/StorageBill' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '501': { $ref: '#/components/responses/NotImplemented' }
  /api/v1/metrics:
    get:
      tags: [Reporting]
      operationId: getMetrics
      summary: Operational metrics (request rates, latencies, ledger and allocation counters)
      x-status: pending
      x-ticket: SP-180
      x-permission: authenticated
      responses:
        '200':
          description: Metrics snapshot.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties: { data: { $ref: '#/components/schemas/Metrics' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '501': { $ref: '#/components/responses/NotImplemented' }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: sp_session
      description: >-
        Opaque session token set by `POST /api/v1/auth/login` (HttpOnly, SameSite=Lax,
        Secure when NODE_ENV=production). The server stores only HMAC-SHA256(token).
        Mutating requests must also send the CSRF token in `X-CSRF-Token`.

  headers:
    RetryAfter:
      description: Seconds until the client may retry.
      schema: { type: integer, minimum: 1 }
    RequestId:
      description: Request id (echoed from a valid incoming `X-Request-Id`, otherwise a UUID).
      schema: { type: string }

  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: >-
        Double-submit CSRF token. Must equal the session's token (the `sp_csrf` cookie,
        `data.csrfToken` from login or `/auth/me`). Missing or wrong answers
        `403 CSRF_INVALID`.
      schema: { type: string }
    WarehouseIdPath:
      name: warehouseId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    BinIdPath:
      name: binId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    SkuIdPath:
      name: skuId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    AllocationIdPath:
      name: allocationId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    UserIdPath:
      name: userId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    AsnIdPath:
      name: asnId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    TaskIdPath:
      name: taskId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    OrderIdPath:
      name: orderId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    WaveIdPath:
      name: waveId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    ShipmentIdPath:
      name: shipmentId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    ManifestIdPath:
      name: manifestId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    CountIdPath:
      name: countId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    RmaIdPath:
      name: rmaId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    WarehouseIdQuery:
      name: warehouseId
      in: query
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }

  responses:
    BadRequest:
      description: >-
        `VALIDATION_FAILED` (zod issues in `details` as `[{ path, message }]`, or a
        referenced record that does not exist), `BAD_REQUEST` (malformed JSON or other
        framework-level 4xx), or a domain rule code `INVALID_QUANTITY`, `INVALID_UOM`,
        `NON_INTEGRAL_CONVERSION`, `INVALID_UOM_LADDER`, `INVALID_BIN_CODE`,
        `INVALID_DATE`, `INVALID_MOVEMENT`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            data: null
            error:
              code: VALIDATION_FAILED
              message: Request validation failed
              details:
                - { path: quantity, message: Expected integer, received float }
    Unauthenticated:
      description: '`UNAUTHENTICATED`: no valid, unexpired session cookie.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            data: null
            error: { code: UNAUTHENTICATED, message: Authentication required }
    InvalidCredentials:
      description: '`INVALID_CREDENTIALS`: generic login failure.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            data: null
            error: { code: INVALID_CREDENTIALS, message: Email or password is incorrect }
    Forbidden:
      description: '`FORBIDDEN` (role lacks the permission) or `CSRF_INVALID` (mutating request without a matching X-CSRF-Token).'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            data: null
            error: { code: CSRF_INVALID, message: Missing or invalid CSRF token }
    NotFound:
      description: '`NOT_FOUND` with the entity name in the message (Warehouse, Zone, Bin, SKU, Lot, Allocation).'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            data: null
            error: { code: NOT_FOUND, message: Warehouse not found }
    Conflict:
      description: >-
        State conflict. `ALREADY_EXISTS` (unique key, `details.constraint`),
        `CONSTRAINT_VIOLATION` (stock CHECK constraint), `INSUFFICIENT_AVAILABLE`,
        `INSUFFICIENT_ALLOCATED`, `INSUFFICIENT_STOCK`, `LOT_EXPIRY_MISMATCH`,
        `BIN_INACTIVE`, `ALREADY_RELEASED`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            data: null
            error:
              code: INSUFFICIENT_AVAILABLE
              message: Not enough available stock in bin
              details:
                {
                  binId: 5b0e1b39-2b7e-4a8e-9b0e-6f1c2d3e4f50,
                  lotId: 7c1d2e3f-4a5b-4c6d-8e7f-9a0b1c2d3e4f,
                  requested: 30,
                  available: 12,
                }
    RateLimited:
      description: '`RATE_LIMITED`: authentication throttle tripped. `details.retryAfterSeconds` equals the Retry-After header.'
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            data: null
            error:
              code: RATE_LIMITED
              message: Too many failed login attempts, try again later
              details: { retryAfterSeconds: 60 }
    UnsupportedMediaType:
      description: '`UNSUPPORTED_MEDIA_TYPE`: request body is not application/json.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ConcurrencyRetry:
      description: '`CONCURRENCY_RETRY`: PostgreSQL reported a deadlock or serialization failure; the transaction was rolled back and is safe to retry.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotImplemented:
      description: '`NOT_IMPLEMENTED`: the operation is part of the target API but not built yet; `details.ticket` names the backlog ticket.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/NotImplementedEnvelope' }
          example:
            data: null
            error:
              code: NOT_IMPLEMENTED
              message: Wave planning is planned but not implemented yet
              details: { ticket: SP-092 }

  schemas:
    # ------------------------------------------------------------ envelope
    SuccessEnvelope:
      type: object
      required: [data, error]
      properties:
        data: {}
        error: { type: 'null' }
        meta:
          type: object
          additionalProperties: true
    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code: { $ref: '#/components/schemas/ErrorCode' }
        message: { type: string }
        details: {}
    ErrorEnvelope:
      type: object
      required: [data, error]
      properties:
        data: { type: 'null' }
        error: { $ref: '#/components/schemas/ErrorBody' }
    NotImplementedEnvelope:
      type: object
      required: [data, error]
      properties:
        data: { type: 'null' }
        error:
          type: object
          required: [code, message, details]
          properties:
            code: { const: NOT_IMPLEMENTED }
            message: { type: string }
            details:
              type: object
              required: [ticket]
              properties:
                ticket: { type: string, pattern: '^SP-\d{3}$' }
    ValidationIssue:
      type: object
      required: [path, message]
      properties:
        path: { type: string, description: Dot-joined zod issue path (empty for the root). }
        message: { type: string }
    ErrorCode:
      type: string
      enum:
        - VALIDATION_FAILED
        - BAD_REQUEST
        - UNSUPPORTED_MEDIA_TYPE
        - INVALID_QUANTITY
        - INVALID_UOM
        - NON_INTEGRAL_CONVERSION
        - INVALID_UOM_LADDER
        - INVALID_BIN_CODE
        - INVALID_DATE
        - INVALID_MOVEMENT
        - UNAUTHENTICATED
        - INVALID_CREDENTIALS
        - FORBIDDEN
        - CSRF_INVALID
        - NOT_FOUND
        - ROUTE_NOT_FOUND
        - ALREADY_EXISTS
        - CONSTRAINT_VIOLATION
        - INSUFFICIENT_AVAILABLE
        - INSUFFICIENT_ALLOCATED
        - INSUFFICIENT_STOCK
        - LOT_EXPIRY_MISMATCH
        - BIN_INACTIVE
        - ALREADY_RELEASED
        - RATE_LIMITED
        - NOT_IMPLEMENTED
        - NOT_READY
        - CONCURRENCY_RETRY
        - INTERNAL_ERROR
    CursorMeta:
      type: object
      required: [limit, nextCursor]
      properties:
        limit: { type: integer }
        nextCursor:
          type: [string, 'null']
          description: Pass as `before` to fetch the next (older) page; null on the last page.
    CountMeta:
      type: object
      required: [count, limit]
      properties:
        count: { type: integer }
        limit: { type: integer }

    # ------------------------------------------------------------ primitives
    Uuid: { type: string, format: uuid }
    IsoDate:
      type: string
      pattern: '^\d{4}-\d{2}-\d{2}$'
      description: Calendar date YYYY-MM-DD (no time zone).
      examples: ['2026-12-31']
    Quantity:
      type: integer
      minimum: 1
      maximum: 1000000000000
      description: Positive whole number. Base units unless paired with a `uom`.
    BaseQuantity:
      type: integer
      minimum: 0
      description: Whole number of the SKU's base unit.
    UomCode:
      type: string
      pattern: '^[A-Z][A-Z0-9]{0,9}$'
      description: Unit code (input is trimmed and upper-cased), e.g. EA, CS, PL.
    Code:
      type: string
      minLength: 1
      maxLength: 32
      pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]*$'
      description: Business code; stored upper-cased.
    Role:
      type: string
      enum: [owner, admin, manager, operator, viewer]
    Permission:
      type: string
      enum:
        - topology:read
        - topology:write
        - catalog:read
        - catalog:write
        - inventory:read
        - inventory:receive
        - inventory:move
        - inventory:adjust
        - inventory:verify
        - allocation:read
        - allocation:write
        - audit:read
        - users:manage
    AllocationStrategy:
      type: string
      enum: [FEFO, FIFO, LIFO]
    ZoneType:
      type: string
      enum: [RECEIVING, STORAGE, PICK, STAGING, SHIPPING, QUARANTINE]
    MovementType:
      type: string
      enum: [RECEIPT, MOVE, ADJUST_IN, ADJUST_OUT, ALLOCATE, DEALLOCATE]
    AdjustmentReason:
      type: string
      enum: [DAMAGED, FOUND, LOST, EXPIRED, CORRECTION]

    # ------------------------------------------------------------ health
    Health:
      type: object
      required: [status, uptimeSeconds]
      properties:
        status: { const: ok }
        uptimeSeconds: { type: integer }
    Ready:
      type: object
      required: [status, database, migrations]
      properties:
        status: { const: ready }
        database: { const: up }
        migrations: { type: integer, description: Number of applied migrations. }

    # ------------------------------------------------------------ auth
    RegisterRequest:
      type: object
      required: [organizationName, name, email, password]
      properties:
        organizationName: { type: string, minLength: 2, maxLength: 120 }
        name: { type: string, minLength: 1, maxLength: 120 }
        email:
          { type: string, format: email, maxLength: 254, description: Trimmed and lower-cased. }
        password: { type: string, minLength: 12, maxLength: 200 }
    RegisterAccepted:
      type: object
      required: [status, message]
      properties:
        status: { const: accepted }
        message:
          type: string
          examples:
            ['If this email can be registered, the workspace is ready. Sign in to continue.']
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 200 }
    LoginResult:
      type: object
      required: [user, csrfToken]
      properties:
        user:
          type: object
          required: [id, email, name, role, organizationId]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            email: { type: string }
            name: { type: string }
            role: { $ref: '#/components/schemas/Role' }
            organizationId: { $ref: '#/components/schemas/Uuid' }
        csrfToken: { type: string }
    MeResult:
      type: object
      required: [user, organization, csrfToken]
      properties:
        user:
          type: object
          required: [id, email, name, role]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            email: { type: string }
            name: { type: string }
            role: { $ref: '#/components/schemas/Role' }
        organization:
          type: object
          required: [id, name]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            name: { type: string }
        csrfToken: { type: string }

    # ------------------------------------------------------------ topology
    Warehouse:
      type: object
      required: [id, code, name, timezone, isActive, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        code: { type: string, examples: [LDN1] }
        name: { type: string }
        timezone: { type: string, description: Canonical IANA zone, examples: [Europe/London] }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
    CreateWarehouseRequest:
      type: object
      required: [code, name]
      properties:
        code: { $ref: '#/components/schemas/Code' }
        name: { type: string, minLength: 1, maxLength: 120 }
        timezone: { type: string, minLength: 1, maxLength: 64, default: UTC }
    Zone:
      type: object
      required: [id, warehouseId, code, name, zoneType]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        warehouseId: { $ref: '#/components/schemas/Uuid' }
        code: { type: string }
        name: { type: string }
        zoneType: { $ref: '#/components/schemas/ZoneType' }
    CreateZoneRequest:
      type: object
      required: [code, name, zoneType]
      properties:
        code: { $ref: '#/components/schemas/Code' }
        name: { type: string, minLength: 1, maxLength: 120 }
        zoneType: { $ref: '#/components/schemas/ZoneType' }
    Bin:
      type: object
      required:
        [
          id,
          warehouseId,
          zoneId,
          zoneCode,
          code,
          pickSequence,
          maxWeightGrams,
          maxVolumeCm3,
          isActive,
        ]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        warehouseId: { $ref: '#/components/schemas/Uuid' }
        zoneId: { $ref: '#/components/schemas/Uuid' }
        zoneCode: { type: string }
        code: { type: string, examples: [A-03-12-2-B] }
        pickSequence: { type: integer, minimum: 0 }
        maxWeightGrams: { type: [integer, 'null'] }
        maxVolumeCm3: { type: [integer, 'null'] }
        isActive: { type: boolean }
    CreateBinRequest:
      type: object
      required: [zoneId, code]
      properties:
        zoneId: { $ref: '#/components/schemas/Uuid' }
        code: { type: string, minLength: 2, maxLength: 32 }
        pickSequence: { type: integer, minimum: 0, maximum: 2000000000 }
        maxWeightGrams: { type: integer, minimum: 1, maximum: 100000000 }
        maxVolumeCm3: { type: integer, minimum: 1, maximum: 1000000000 }
    WarehousePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        timezone: { type: string, maxLength: 64 }
        isActive: { type: boolean }
    BinPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        pickSequence: { type: integer, minimum: 0 }
        maxWeightGrams: { type: [integer, 'null'], minimum: 1 }
        maxVolumeCm3: { type: [integer, 'null'], minimum: 1 }
        isActive: { type: boolean, description: Deactivation is refused while the bin holds stock. }
    ImportReport:
      type: object
      required: [rowsRead, created, skipped, errors]
      properties:
        rowsRead: { type: integer }
        created: { type: integer }
        skipped: { type: integer }
        errors:
          type: array
          items:
            type: object
            properties:
              row: { type: integer }
              message: { type: string }
    WarehouseMap:
      type: object
      required: [warehouseId, zones]
      properties:
        warehouseId: { $ref: '#/components/schemas/Uuid' }
        zones:
          type: array
          items:
            type: object
            properties:
              zoneId: { $ref: '#/components/schemas/Uuid' }
              code: { type: string }
              bins:
                type: array
                items:
                  type: object
                  properties:
                    binId: { $ref: '#/components/schemas/Uuid' }
                    code: { type: string }
                    x: { type: number }
                    y: { type: number }
                    utilisation: { type: number, minimum: 0, maximum: 1 }

    # ------------------------------------------------------------ catalogue
    UomLevel:
      type: object
      required: [code, factor]
      properties:
        code: { $ref: '#/components/schemas/UomCode' }
        factor:
          { type: integer, minimum: 2, description: Base units contained in one of this unit. }
    Sku:
      type: object
      required:
        [
          id,
          code,
          description,
          baseUom,
          uomLevels,
          lotTracked,
          expiryTracked,
          defaultStrategy,
          isActive,
        ]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        code: { type: string, examples: [MILK-UHT-1L] }
        description: { type: string }
        baseUom: { $ref: '#/components/schemas/UomCode' }
        uomLevels:
          type: array
          description: Sorted ascending by factor; each factor is a multiple of the previous.
          items: { $ref: '#/components/schemas/UomLevel' }
        lotTracked: { type: boolean }
        expiryTracked: { type: boolean }
        defaultStrategy: { $ref: '#/components/schemas/AllocationStrategy' }
        isActive: { type: boolean }
    CreateSkuRequest:
      type: object
      required: [code, description]
      properties:
        code: { $ref: '#/components/schemas/Code' }
        description: { type: string, minLength: 1, maxLength: 240 }
        baseUom: { allOf: [{ $ref: '#/components/schemas/UomCode' }], default: EA }
        uomLevels:
          type: array
          maxItems: 6
          default: []
          items: { $ref: '#/components/schemas/UomLevel' }
        lotTracked: { type: boolean, default: false }
        expiryTracked: { type: boolean, default: false, description: Requires lotTracked. }
        defaultStrategy:
          { allOf: [{ $ref: '#/components/schemas/AllocationStrategy' }], default: FIFO }
    SkuPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        description: { type: string, minLength: 1, maxLength: 240 }
        uomLevels: { type: array, maxItems: 6, items: { $ref: '#/components/schemas/UomLevel' } }
        defaultStrategy: { $ref: '#/components/schemas/AllocationStrategy' }
        isActive: { type: boolean }
    Lot:
      type: object
      required: [id, skuId, lotCode, expiryDate, receivedAt, onHold]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        skuId: { $ref: '#/components/schemas/Uuid' }
        lotCode: { type: string, description: Upper-cased; AUTO-YYYYMMDD for untracked SKUs. }
        expiryDate: { oneOf: [{ $ref: '#/components/schemas/IsoDate' }, { type: 'null' }] }
        receivedAt:
          { type: string, format: date-time, description: First receipt; drives FIFO / LIFO. }
        onHold: { type: boolean }
    Serial:
      type: object
      required: [serial, skuId, status]
      properties:
        serial: { type: string, maxLength: 64 }
        skuId: { $ref: '#/components/schemas/Uuid' }
        lotId: { $ref: '#/components/schemas/Uuid' }
        binId: { type: [string, 'null'], format: uuid }
        status: { type: string, enum: [IN_STOCK, ALLOCATED, SHIPPED, RETURNED] }

    # ------------------------------------------------------------ inventory
    ReceiptRequest:
      type: object
      required: [warehouseId, binId, skuId, quantity]
      properties:
        warehouseId: { $ref: '#/components/schemas/Uuid' }
        binId: { $ref: '#/components/schemas/Uuid' }
        skuId: { $ref: '#/components/schemas/Uuid' }
        quantity: { $ref: '#/components/schemas/Quantity' }
        uom: { $ref: '#/components/schemas/UomCode' }
        lotCode: { type: string, minLength: 1, maxLength: 40 }
        expiryDate: { $ref: '#/components/schemas/IsoDate' }
        reference: { type: string, maxLength: 64 }
    LedgerBalance:
      type: object
      description: Projection row keyed by (bin, sku, lot). available = onHand - allocated.
      required: [binId, skuId, lotId, onHand, allocated]
      properties:
        binId: { $ref: '#/components/schemas/Uuid' }
        skuId: { $ref: '#/components/schemas/Uuid' }
        lotId: { $ref: '#/components/schemas/Uuid' }
        onHand: { $ref: '#/components/schemas/BaseQuantity' }
        allocated: { $ref: '#/components/schemas/BaseQuantity' }
    ReceiptResult:
      type: object
      required: [movementId, correlationId, lot, quantity, quantityDescription, balance]
      properties:
        movementId: { type: integer }
        correlationId: { $ref: '#/components/schemas/Uuid' }
        lot: { $ref: '#/components/schemas/Lot' }
        quantity: { $ref: '#/components/schemas/BaseQuantity' }
        quantityDescription: { type: string, examples: ['1 PL + 3 CS + 4 EA'] }
        balance: { $ref: '#/components/schemas/LedgerBalance' }
    MoveRequest:
      type: object
      required: [warehouseId, fromBinId, toBinId, skuId, lotId, quantity]
      properties:
        warehouseId: { $ref: '#/components/schemas/Uuid' }
        fromBinId: { $ref: '#/components/schemas/Uuid' }
        toBinId: { $ref: '#/components/schemas/Uuid' }
        skuId: { $ref: '#/components/schemas/Uuid' }
        lotId: { $ref: '#/components/schemas/Uuid' }
        quantity: { $ref: '#/components/schemas/Quantity' }
        uom: { $ref: '#/components/schemas/UomCode' }
        reference: { type: string, maxLength: 64 }
    MoveResult:
      type: object
      required: [movementId, correlationId, quantity, balances]
      properties:
        movementId: { type: integer }
        correlationId: { $ref: '#/components/schemas/Uuid' }
        quantity: { $ref: '#/components/schemas/BaseQuantity' }
        balances:
          {
            type: array,
            minItems: 2,
            maxItems: 2,
            items: { $ref: '#/components/schemas/LedgerBalance' },
          }
    AdjustmentRequest:
      type: object
      required: [warehouseId, binId, skuId, lotId, delta, reason]
      properties:
        warehouseId: { $ref: '#/components/schemas/Uuid' }
        binId: { $ref: '#/components/schemas/Uuid' }
        skuId: { $ref: '#/components/schemas/Uuid' }
        lotId: { $ref: '#/components/schemas/Uuid' }
        delta:
          { type: integer, not: { const: 0 }, description: Signed base units; must not be zero. }
        reason: { $ref: '#/components/schemas/AdjustmentReason' }
        note: { type: string, maxLength: 240, description: Stored as the movement reference. }
    AdjustmentResult:
      type: object
      required: [movementId, correlationId, balance]
      properties:
        movementId: { type: integer }
        correlationId: { $ref: '#/components/schemas/Uuid' }
        balance: { $ref: '#/components/schemas/LedgerBalance' }
    BalanceRow:
      type: object
      required:
        [
          binId,
          binCode,
          zoneCode,
          skuId,
          skuCode,
          skuDescription,
          baseUom,
          lotId,
          lotCode,
          expiryDate,
          onHand,
          allocated,
          available,
          updatedAt,
        ]
      properties:
        binId: { $ref: '#/components/schemas/Uuid' }
        binCode: { type: string }
        zoneCode: { type: string }
        skuId: { $ref: '#/components/schemas/Uuid' }
        skuCode: { type: string }
        skuDescription: { type: string }
        baseUom: { type: string }
        lotId: { $ref: '#/components/schemas/Uuid' }
        lotCode: { type: string }
        expiryDate: { oneOf: [{ $ref: '#/components/schemas/IsoDate' }, { type: 'null' }] }
        onHand: { $ref: '#/components/schemas/BaseQuantity' }
        allocated: { $ref: '#/components/schemas/BaseQuantity' }
        available: { $ref: '#/components/schemas/BaseQuantity' }
        updatedAt: { type: string, format: date-time }
    Movement:
      type: object
      required:
        [
          id,
          movementType,
          skuId,
          skuCode,
          lotId,
          lotCode,
          fromBinId,
          fromBinCode,
          toBinId,
          toBinCode,
          quantity,
          reason,
          reference,
          correlationId,
          actorUserId,
          occurredAt,
        ]
      properties:
        id: { type: integer, description: Global ledger sequence; also the pagination cursor. }
        movementType: { $ref: '#/components/schemas/MovementType' }
        skuId: { $ref: '#/components/schemas/Uuid' }
        skuCode: { type: string }
        lotId: { $ref: '#/components/schemas/Uuid' }
        lotCode: { type: string }
        fromBinId: { type: [string, 'null'], format: uuid }
        fromBinCode: { type: [string, 'null'] }
        toBinId: { type: [string, 'null'], format: uuid }
        toBinCode: { type: [string, 'null'] }
        quantity: { $ref: '#/components/schemas/Quantity' }
        reason: { type: [string, 'null'] }
        reference: { type: [string, 'null'] }
        correlationId: { $ref: '#/components/schemas/Uuid' }
        actorUserId: { type: [string, 'null'], format: uuid }
        occurredAt: { type: string, format: date-time }
    BalanceMismatch:
      type: object
      required: [key, expected, actual]
      properties:
        key:
          type: object
          required: [binId, skuId, lotId]
          properties:
            binId: { $ref: '#/components/schemas/Uuid' }
            skuId: { $ref: '#/components/schemas/Uuid' }
            lotId: { $ref: '#/components/schemas/Uuid' }
        expected:
          type: object
          description: Value derived from the ledger.
          properties:
            onHand: { type: integer }
            allocated: { type: integer }
        actual:
          type: object
          description: Value stored in stock_balances.
          properties:
            onHand: { type: integer }
            allocated: { type: integer }
    ProjectionReport:
      type: object
      required: [consistent, movementCount, balanceCount, mismatches]
      properties:
        consistent: { type: boolean }
        movementCount: { type: integer }
        balanceCount: { type: integer }
        mismatches: { type: array, items: { $ref: '#/components/schemas/BalanceMismatch' } }
    HoldRequest:
      type: object
      required: [warehouseId, skuId, lotId, status, reason]
      properties:
        warehouseId: { $ref: '#/components/schemas/Uuid' }
        skuId: { $ref: '#/components/schemas/Uuid' }
        lotId: { $ref: '#/components/schemas/Uuid' }
        binId: { $ref: '#/components/schemas/Uuid' }
        quantity: { $ref: '#/components/schemas/Quantity' }
        status: { type: string, enum: [QUARANTINE, DAMAGED, QA] }
        reason: { type: string, maxLength: 240 }
    Hold:
      allOf:
        - $ref: '#/components/schemas/HoldRequest'
        - type: object
          required: [id, createdAt]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            createdAt: { type: string, format: date-time }
            releasedAt: { type: [string, 'null'], format: date-time }
    LedgerSnapshot:
      type: object
      required: [id, upToMovementId, balanceCount, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        warehouseId: { type: [string, 'null'], format: uuid }
        upToMovementId: { type: integer }
        balanceCount: { type: integer }
        createdAt: { type: string, format: date-time }

    # ------------------------------------------------------------ allocation
    AllocationRequest:
      type: object
      required: [warehouseId, orderRef, lines]
      properties:
        warehouseId: { $ref: '#/components/schemas/Uuid' }
        orderRef: { type: string, minLength: 1, maxLength: 64 }
        strategy:
          allOf: [{ $ref: '#/components/schemas/AllocationStrategy' }]
          description: Overrides every SKU's defaultStrategy for this order.
        shipComplete:
          { type: boolean, default: false, description: All-or-nothing across every line. }
        minShelfLifeDays: { type: integer, minimum: 0, maximum: 3650 }
        lines:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            required: [skuId, quantity]
            properties:
              skuId: { $ref: '#/components/schemas/Uuid' }
              quantity: { $ref: '#/components/schemas/Quantity' }
              uom: { $ref: '#/components/schemas/UomCode' }
    AllocationHeader:
      type: object
      required:
        [id, warehouseId, orderRef, status, shipComplete, minShelfLifeDays, createdAt, releasedAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        warehouseId: { $ref: '#/components/schemas/Uuid' }
        orderRef: { type: string }
        status: { type: string, enum: [ALLOCATED, PARTIAL, RELEASED] }
        shipComplete: { type: boolean }
        minShelfLifeDays: { type: [integer, 'null'] }
        createdAt: { type: string, format: date-time }
        releasedAt: { type: [string, 'null'], format: date-time }
    AllocationPick:
      type: object
      required: [binId, binCode, lotId, lotCode, expiryDate, quantity]
      properties:
        binId: { $ref: '#/components/schemas/Uuid' }
        binCode: { type: string }
        lotId: { $ref: '#/components/schemas/Uuid' }
        lotCode: { type: string }
        expiryDate: { oneOf: [{ $ref: '#/components/schemas/IsoDate' }, { type: 'null' }] }
        quantity: { $ref: '#/components/schemas/Quantity' }
    AllocationLine:
      type: object
      required: [lineNo, skuId, skuCode, strategy, requested, allocated, picks]
      properties:
        lineNo: { type: integer, minimum: 1 }
        skuId: { $ref: '#/components/schemas/Uuid' }
        skuCode: { type: string }
        strategy: { $ref: '#/components/schemas/AllocationStrategy' }
        requested: { $ref: '#/components/schemas/Quantity' }
        allocated: { $ref: '#/components/schemas/BaseQuantity' }
        picks: { type: array, items: { $ref: '#/components/schemas/AllocationPick' } }
    Allocation:
      allOf:
        - $ref: '#/components/schemas/AllocationHeader'
        - type: object
          required: [lines]
          properties:
            lines: { type: array, items: { $ref: '#/components/schemas/AllocationLine' } }

    # ------------------------------------------------------------ pending: identity
    VerifyEmailRequest:
      type: object
      required: [token]
      properties:
        token: { type: string, minLength: 32, maxLength: 128 }
    VerifyEmailResult:
      type: object
      required: [email, verifiedAt]
      properties:
        email: { type: string, format: email }
        verifiedAt: { type: string, format: date-time }
    PasswordResetRequest:
      oneOf:
        - type: object
          required: [email]
          properties:
            email: { type: string, format: email }
        - type: object
          required: [token, newPassword]
          properties:
            token: { type: string, minLength: 32, maxLength: 128 }
            newPassword: { type: string, minLength: 12, maxLength: 200 }
    User:
      type: object
      required: [id, email, name, role, isActive, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        email: { type: string, format: email }
        name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        lastLoginAt: { type: [string, 'null'], format: date-time }
    InvitationRequest:
      type: object
      required: [email, role]
      properties:
        email: { type: string, format: email }
        name: { type: string, maxLength: 120 }
        role: { $ref: '#/components/schemas/Role' }
    Invitation:
      type: object
      required: [id, email, role, expiresAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }
        expiresAt: { type: string, format: date-time }
    UserPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        role: { $ref: '#/components/schemas/Role' }
        isActive: { type: boolean }
    RoleDefinition:
      type: object
      required: [name, builtIn, permissions]
      properties:
        name: { type: string }
        builtIn: { type: boolean }
        permissions: { type: array, items: { $ref: '#/components/schemas/Permission' } }
    Client:
      type: object
      required: [id, code, name, isActive]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        code: { type: string }
        name: { type: string }
        isActive: { type: boolean }
    AuditEvent:
      type: object
      required: [id, action, entityType, occurredAt]
      properties:
        id: { type: integer }
        actorUserId: { type: [string, 'null'], format: uuid }
        action: { type: string, examples: [allocation.created] }
        entityType: { type: string }
        entityId: { type: [string, 'null'] }
        requestId: { type: [string, 'null'] }
        metadata: { type: object, additionalProperties: true }
        occurredAt: { type: string, format: date-time }

    # ------------------------------------------------------------ pending: inbound / putaway
    AsnStatus:
      type: string
      enum: [EXPECTED, RECEIVING, CLOSED, CANCELLED]
    AsnLine:
      type: object
      required: [lineNo, skuId, expectedQty, receivedQty]
      properties:
        lineNo: { type: integer }
        skuId: { $ref: '#/components/schemas/Uuid' }
        expectedQty: { $ref: '#/components/schemas/Quantity' }
        receivedQty: { $ref: '#/components/schemas/BaseQuantity' }
        damagedQty: { $ref: '#/components/schemas/BaseQuantity' }
        lotCode: { type: [string, 'null'] }
        expiryDate: { oneOf: [{ $ref: '#/components/schemas/IsoDate' }, { type: 'null' }] }
    Asn:
      type: object
      required: [id, warehouseId, asnNumber, status, expectedAt, lines]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        warehouseId: { $ref: '#/components/schemas/Uuid' }
        asnNumber: { type: string }
        supplier: { type: string }
        status: { $ref: '#/components/schemas/AsnStatus' }
        expectedAt: { type: string, format: date-time }
        lines: { type: array, items: { $ref: '#/components/schemas/AsnLine' } }
    CreateAsnRequest:
      type: object
      required: [warehouseId, asnNumber, expectedAt, lines]
      properties:
        warehouseId: { $ref: '#/components/schemas/Uuid' }
        asnNumber: { type: string, maxLength: 64 }
        supplier: { type: string, maxLength: 120 }
        expectedAt: { type: string, format: date-time }
        lines:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: object
            required: [skuId, quantity]
            properties:
              skuId: { $ref: '#/components/schemas/Uuid' }
              quantity: { $ref: '#/components/schemas/Quantity' }
              uom: { $ref: '#/components/schemas/UomCode' }
              lotCode: { type: string, maxLength: 40 }
              expiryDate: { $ref: '#/components/schemas/IsoDate' }
    AsnReceiptRequest:
      type: object
      required: [lineNo, binId, quantity]
      properties:
        lineNo: { type: integer, minimum: 1 }
        binId: { $ref: '#/components/schemas/Uuid' }
        quantity: { $ref: '#/components/schemas/Quantity' }
        uom: { $ref: '#/components/schemas/UomCode' }
        lotCode: { type: string, maxLength: 40 }
        expiryDate: { $ref: '#/components/schemas/IsoDate' }
        damagedQuantity: { type: integer, minimum: 0 }
    AsnDiscrepancyReport:
      type: object
      required: [asnId, status, lines]
      properties:
        asnId: { $ref: '#/components/schemas/Uuid' }
        status: { const: CLOSED }
        lines:
          type: array
          items:
            type: object
            properties:
              lineNo: { type: integer }
              expected: { type: integer }
              received: { type: integer }
              damaged: { type: integer }
              variance: { type: integer }
              kind: { type: string, enum: [MATCH, OVER, SHORT, DAMAGED] }
    InspectionRequest:
      type: object
      required: [warehouseId, lotId, result]
      properties:
        warehouseId: { $ref: '#/components/schemas/Uuid' }
        lotId: { $ref: '#/components/schemas/Uuid' }
        sampleSize: { type: integer, minimum: 1 }
        result: { type: string, enum: [PASS, FAIL] }
        notes: { type: string, maxLength: 1000 }
    Inspection:
      allOf:
        - $ref: '#/components/schemas/InspectionRequest'
        - type: object
          required: [id, inspectedAt]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            inspectedAt: { type: string, format: date-time }
            holdId: { type: [string, 'null'], format: uuid }
    PutawaySuggestionRequest:
      type: object
      required: [warehouseId, skuId, lotId, quantity, fromBinId]
      properties:
        warehouseId: { $ref: '#/components/schemas/Uuid' }
        fromBinId: { $ref: '#/components/schemas/Uuid' }
        skuId: { $ref: '#/components/schemas/Uuid' }
        lotId: { $ref: '#/components/schemas/Uuid' }
        quantity: { $ref: '#/components/schemas/Quantity' }
    PutawaySuggestion:
      type: object
      required: [binId, binCode, quantity, score, reasons]
      properties:
        binId: { $ref: '#/components/schemas/Uuid' }
        binCode: { type: string }
        quantity: { $ref: '#/components/schemas/Quantity' }
        score: { type: number }
        reasons: { type: array, items: { type: string } }
    PutawayTask:
      type: object
      required: [id, status, skuId, lotId, fromBinId, toBinId, quantity]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        status: { type: string, enum: [OPEN, IN_PROGRESS, DONE, CANCELLED] }
        skuId: { $ref: '#/components/schemas/Uuid' }
        lotId: { $ref: '#/components/schemas/Uuid' }
        fromBinId: { $ref: '#/components/schemas/Uuid' }
        toBinId: { $ref: '#/components/schemas/Uuid' }
        quantity: { $ref: '#/components/schemas/Quantity' }
        assignedTo: { type: [string, 'null'], format: uuid }
    TaskConfirmRequest:
      type: object
      required: [scannedBinCode, quantity]
      properties:
        scannedBinCode: { type: string, maxLength: 32 }
        scannedLotCode: { type: string, maxLength: 40 }
        quantity: { $ref: '#/components/schemas/Quantity' }
        toBinId: { $ref: '#/components/schemas/Uuid' }
    SlottingRecommendation:
      type: object
      required: [skuId, abcClass, currentBinId, suggestedBinId, estimatedTravelSavingMetres]
      properties:
        skuId: { $ref: '#/components/schemas/Uuid' }
        abcClass: { type: string, enum: [A, B, C] }
        picksPerDay: { type: number }
        currentBinId: { $ref: '#/components/schemas/Uuid' }
        suggestedBinId: { $ref: '#/components/schemas/Uuid' }
        estimatedTravelSavingMetres: { type: number }

    # ------------------------------------------------------------ pending: outbound / picking
    OrderStatus:
      type: string
      enum:
        [
          NEW,
          ALLOCATED,
          PARTIALLY_ALLOCATED,
          BACKORDERED,
          RELEASED,
          PICKED,
          PACKED,
          SHIPPED,
          CANCELLED,
        ]
    Order:
      type: object
      required: [id, warehouseId, orderRef, status, lines, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        warehouseId: { $ref: '#/components/schemas/Uuid' }
        orderRef: { type: string }
        status: { $ref: '#/components/schemas/OrderStatus' }
        carrier: { type: [string, 'null'] }
        cutOffAt: { type: [string, 'null'], format: date-time }
        allocationId: { type: [string, 'null'], format: uuid }
        lines:
          type: array
          items:
            type: object
            properties:
              lineNo: { type: integer }
              skuId: { $ref: '#/components/schemas/Uuid' }
              quantity: { $ref: '#/components/schemas/Quantity' }
        createdAt: { type: string, format: date-time }
    CreateOrderRequest:
      type: object
      required: [warehouseId, orderRef, lines]
      properties:
        warehouseId: { $ref: '#/components/schemas/Uuid' }
        orderRef: { type: string, maxLength: 64 }
        carrier: { type: string, maxLength: 32 }
        cutOffAt: { type: string, format: date-time }
        shipComplete: { type: boolean, default: false }
        shipTo:
          type: object
          properties:
            name: { type: string, maxLength: 120 }
            line1: { type: string, maxLength: 120 }
            city: { type: string, maxLength: 80 }
            postcode: { type: string, maxLength: 16 }
            country: { type: string, pattern: '^[A-Z]{2}$' }
        lines:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            required: [skuId, quantity]
            properties:
              skuId: { $ref: '#/components/schemas/Uuid' }
              quantity: { $ref: '#/components/schemas/Quantity' }
              uom: { $ref: '#/components/schemas/UomCode' }
    Wave:
      type: object
      required: [id, warehouseId, status, orderCount, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        warehouseId: { $ref: '#/components/schemas/Uuid' }
        status: { type: string, enum: [PLANNED, RELEASED, PICKING, DONE] }
        carrier: { type: [string, 'null'] }
        cutOffAt: { type: [string, 'null'], format: date-time }
        zoneCodes: { type: array, items: { type: string } }
        orderCount: { type: integer }
        createdAt: { type: string, format: date-time }
    CreateWaveRequest:
      type: object
      required: [warehouseId]
      properties:
        warehouseId: { $ref: '#/components/schemas/Uuid' }
        carrier: { type: string, maxLength: 32 }
        cutOffBefore: { type: string, format: date-time }
        zoneCodes: { type: array, items: { type: string } }
        maxOrders: { type: integer, minimum: 1, maximum: 1000, default: 200 }
    WaveReleaseResult:
      type: object
      required: [waveId, allocated, backordered, pickTaskCount]
      properties:
        waveId: { $ref: '#/components/schemas/Uuid' }
        allocated: { type: integer }
        backordered: { type: integer }
        pickTaskCount: { type: integer }
    PickPathRequest:
      type: object
      required: [warehouseId, binIds]
      properties:
        warehouseId: { $ref: '#/components/schemas/Uuid' }
        startBinId: { $ref: '#/components/schemas/Uuid' }
        binIds:
          { type: array, minItems: 1, maxItems: 500, items: { $ref: '#/components/schemas/Uuid' } }
        method: { type: string, enum: [S_SHAPE, LARGEST_GAP, TWO_OPT], default: TWO_OPT }
    PickPathResult:
      type: object
      required: [orderedBinIds, distanceMetres, method]
      properties:
        orderedBinIds: { type: array, items: { $ref: '#/components/schemas/Uuid' } }
        distanceMetres: { type: number }
        baselineDistanceMetres:
          { type: number, description: Distance of the pick-sequence order, for comparison. }
        method: { type: string }
    PickTask:
      type: object
      required: [id, status, sequence, binId, binCode, skuId, lotId, quantity]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        waveId: { type: [string, 'null'], format: uuid }
        allocationId: { $ref: '#/components/schemas/Uuid' }
        status: { type: string, enum: [OPEN, PICKED, SHORT, CANCELLED] }
        sequence: { type: integer }
        binId: { $ref: '#/components/schemas/Uuid' }
        binCode: { type: string }
        skuId: { $ref: '#/components/schemas/Uuid' }
        lotId: { $ref: '#/components/schemas/Uuid' }
        quantity: { $ref: '#/components/schemas/Quantity' }
        pickedQuantity: { $ref: '#/components/schemas/BaseQuantity' }
    ShortPickRequest:
      type: object
      required: [scannedBinCode, foundQuantity]
      properties:
        scannedBinCode: { type: string, maxLength: 32 }
        foundQuantity: { type: integer, minimum: 0 }
        note: { type: string, maxLength: 240 }
    ShortPickResult:
      type: object
      required: [task, adjustmentMovementId, reallocated]
      properties:
        task: { $ref: '#/components/schemas/PickTask' }
        adjustmentMovementId: { type: integer }
        reallocated: { $ref: '#/components/schemas/BaseQuantity' }
        replacementTaskIds: { type: array, items: { $ref: '#/components/schemas/Uuid' } }

    # ------------------------------------------------------------ pending: packing / shipping
    CartonType:
      type: object
      required: [id, code, innerLengthMm, innerWidthMm, innerHeightMm, maxWeightGrams]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        code: { type: string }
        innerLengthMm: { type: integer, minimum: 1 }
        innerWidthMm: { type: integer, minimum: 1 }
        innerHeightMm: { type: integer, minimum: 1 }
        tareGrams: { type: integer, minimum: 0 }
        maxWeightGrams: { type: integer, minimum: 1 }
    CartonizationRequest:
      type: object
      required: [items]
      properties:
        orderId: { $ref: '#/components/schemas/Uuid' }
        cartonTypeIds: { type: array, items: { $ref: '#/components/schemas/Uuid' } }
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [skuId, quantity]
            properties:
              skuId: { $ref: '#/components/schemas/Uuid' }
              quantity: { $ref: '#/components/schemas/Quantity' }
    CartonizationResult:
      type: object
      required: [cartons, fillRatio]
      properties:
        fillRatio: { type: number, minimum: 0, maximum: 1 }
        unpacked:
          {
            type: array,
            items:
              {
                type: object,
                properties: { skuId: { type: string }, quantity: { type: integer } },
              },
          }
        cartons:
          type: array
          items:
            type: object
            properties:
              cartonTypeId: { $ref: '#/components/schemas/Uuid' }
              weightGrams: { type: integer }
              placements:
                type: array
                items:
                  type: object
                  properties:
                    skuId: { $ref: '#/components/schemas/Uuid' }
                    x: { type: integer }
                    y: { type: integer }
                    z: { type: integer }
                    rotation: { type: string, enum: [LWH, LHW, WLH, WHL, HLW, HWL] }
    PackSession:
      type: object
      required: [id, orderId, station, status, startedAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        orderId: { $ref: '#/components/schemas/Uuid' }
        station: { type: string }
        status: { type: string, enum: [OPEN, CLOSED] }
        startedAt: { type: string, format: date-time }
    Shipment:
      type: object
      required: [id, orderId, status, carrier, cartonCount]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        orderId: { $ref: '#/components/schemas/Uuid' }
        status: { type: string, enum: [PACKED, MANIFESTED, SHIPPED] }
        carrier: { type: string }
        trackingNumber: { type: [string, 'null'] }
        cartonCount: { type: integer }
        manifestId: { type: [string, 'null'], format: uuid }
        shippedAt: { type: [string, 'null'], format: date-time }
    Manifest:
      type: object
      required: [id, carrier, shipmentIds, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        carrier: { type: string }
        shipmentIds: { type: array, items: { $ref: '#/components/schemas/Uuid' } }
        totalWeightGrams: { type: integer }
        createdAt: { type: string, format: date-time }
    CarrierRate:
      type: object
      required: [carrier, service, priceMinor, currency]
      properties:
        carrier: { type: string }
        service: { type: string }
        priceMinor: { type: integer, description: Price in integer minor currency units. }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        transitDays: { type: integer }

    # ------------------------------------------------------------ pending: counting / replenishment / returns
    CycleCount:
      type: object
      required: [id, warehouseId, status, lines]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        warehouseId: { $ref: '#/components/schemas/Uuid' }
        status: { type: string, enum: [PLANNED, COUNTING, REVIEW, POSTED] }
        scheduledFor: { $ref: '#/components/schemas/IsoDate' }
        lines:
          type: array
          items:
            type: object
            properties:
              id: { $ref: '#/components/schemas/Uuid' }
              binId: { $ref: '#/components/schemas/Uuid' }
              skuId: { $ref: '#/components/schemas/Uuid' }
              lotId: { $ref: '#/components/schemas/Uuid' }
              countedQty: { type: [integer, 'null'] }
              systemQty:
                {
                  type: [integer, 'null'],
                  description: Hidden from counters until submitted (blind count).,
                }
              variance: { type: [integer, 'null'] }
    CreateCycleCountRequest:
      type: object
      required: [warehouseId]
      properties:
        warehouseId: { $ref: '#/components/schemas/Uuid' }
        scheduledFor: { $ref: '#/components/schemas/IsoDate' }
        abcClasses: { type: array, items: { type: string, enum: [A, B, C] } }
        binIds: { type: array, items: { $ref: '#/components/schemas/Uuid' } }
    CountResultsRequest:
      type: object
      required: [results]
      properties:
        results:
          type: array
          minItems: 1
          items:
            type: object
            required: [lineId, countedQty]
            properties:
              lineId: { $ref: '#/components/schemas/Uuid' }
              countedQty: { type: integer, minimum: 0 }
    ReplenishmentRule:
      type: object
      required: [id, skuId, pickBinId, minQty, maxQty]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        skuId: { $ref: '#/components/schemas/Uuid' }
        pickBinId: { $ref: '#/components/schemas/Uuid' }
        minQty: { $ref: '#/components/schemas/BaseQuantity' }
        maxQty: { $ref: '#/components/schemas/Quantity' }
        replenishUom: { $ref: '#/components/schemas/UomCode' }
    ReplenishmentRunResult:
      type: object
      required: [evaluatedRules, tasks]
      properties:
        evaluatedRules: { type: integer }
        tasks:
          type: array
          items:
            type: object
            properties:
              skuId: { $ref: '#/components/schemas/Uuid' }
              fromBinId: { $ref: '#/components/schemas/Uuid' }
              toBinId: { $ref: '#/components/schemas/Uuid' }
              quantity: { $ref: '#/components/schemas/Quantity' }
    Rma:
      type: object
      required: [id, rmaNumber, status, lines]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        rmaNumber: { type: string }
        orderRef: { type: string }
        status: { type: string, enum: [AUTHORISED, RECEIVED, CLOSED] }
        lines:
          type: array
          items:
            type: object
            properties:
              skuId: { $ref: '#/components/schemas/Uuid' }
              quantity: { $ref: '#/components/schemas/Quantity' }
              receivedQty: { $ref: '#/components/schemas/BaseQuantity' }
    CreateRmaRequest:
      type: object
      required: [warehouseId, orderRef, lines]
      properties:
        warehouseId: { $ref: '#/components/schemas/Uuid' }
        orderRef: { type: string, maxLength: 64 }
        reason: { type: string, maxLength: 240 }
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [skuId, quantity]
            properties:
              skuId: { $ref: '#/components/schemas/Uuid' }
              quantity: { $ref: '#/components/schemas/Quantity' }
    RmaReceiptRequest:
      type: object
      required: [skuId, quantity, disposition, binId]
      properties:
        skuId: { $ref: '#/components/schemas/Uuid' }
        lotCode: { type: string, maxLength: 40 }
        quantity: { $ref: '#/components/schemas/Quantity' }
        binId: { $ref: '#/components/schemas/Uuid' }
        disposition: { type: string, enum: [RESTOCK, QUARANTINE, SCRAP, RETURN_TO_VENDOR] }

    # ------------------------------------------------------------ pending: labels / reporting
    BarcodeRequest:
      type: object
      required: [value]
      properties:
        value:
          {
            type: string,
            minLength: 1,
            maxLength: 80,
            description: Printable ASCII (Code128 B / C).,
          }
        moduleWidth: { type: integer, minimum: 1, maximum: 10, default: 2 }
        height: { type: integer, minimum: 10, maximum: 400, default: 80 }
        humanReadable: { type: boolean, default: true }
    OperationsDashboard:
      type: object
      required: [computedAt, tiles]
      properties:
        computedAt: { type: string, format: date-time }
        tiles:
          type: object
          properties:
            ordersOpen: { type: integer }
            linesPickedToday: { type: integer }
            unitsReceivedToday: { type: integer }
            pickTasksOpen: { type: integer }
            ordersAtRiskOfCutOff: { type: integer }
    AgingRow:
      type: object
      required: [skuId, skuCode, buckets]
      properties:
        skuId: { $ref: '#/components/schemas/Uuid' }
        skuCode: { type: string }
        expiringWithin30Days: { $ref: '#/components/schemas/BaseQuantity' }
        buckets:
          type: object
          properties:
            d0_30: { type: integer }
            d31_90: { type: integer }
            d91_180: { type: integer }
            d181Plus: { type: integer }
    Notification:
      type: object
      required: [id, kind, title, createdAt, readAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        kind: { type: string, examples: [allocation.backordered] }
        title: { type: string }
        body: { type: string }
        createdAt: { type: string, format: date-time }
        readAt: { type: [string, 'null'], format: date-time }
    StorageBill:
      type: object
      required: [clientId, month, currency, lines, totalMinor]
      properties:
        clientId: { $ref: '#/components/schemas/Uuid' }
        month: { type: string }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        totalMinor: { type: integer }
        lines:
          type: array
          items:
            type: object
            properties:
              description: { type: string }
              quantity: { type: number }
              unitPriceMinor: { type: integer }
              amountMinor: { type: integer }
    Metrics:
      type: object
      required: [collectedAt, http, ledger, allocation]
      properties:
        collectedAt: { type: string, format: date-time }
        http:
          type: object
          properties:
            requestsTotal: { type: integer }
            p95LatencyMs: { type: number }
            errors5xx: { type: integer }
        ledger:
          type: object
          properties:
            movementsTotal: { type: integer }
            lastMovementId: { type: integer }
        allocation:
          type: object
          properties:
            allocationsTotal: { type: integer }
            insufficientStockTotal: { type: integer }
            concurrencyRetriesTotal: { type: integer }
