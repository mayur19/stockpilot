openapi: 3.1.0
info:
  title: StockPilot API
  version: 0.1.0
  summary: Warehouse management system API (topology, catalogue, event-sourced inventory ledger, allocation).
  description: >-
    Full target API of StockPilot. Every operation carries `x-status`. Operations with
    `x-status: implemented` are live in `apps/api` and covered by tests. Operations with
    `x-status: pending` are registered by `apps/api/src/modules/pending/pending.catalog.ts`;
    they require a session (and the CSRF header when mutating) and then answer
    `501 NOT_IMPLEMENTED` with `error.details.ticket` set to the backlog ticket in
    `x-ticket` (see docs/planning/backlog.md). The request and response schemas of pending
    operations describe the planned contract and may still change before the ticket ships.


    Every response body uses the envelope `{ data, error, meta? }`; see docs/api/README.md
    for conventions, error codes, pagination, authentication and curl examples.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://127.0.0.1:4103
    description: Local API started by ./run.sh (API_HOST / API_PORT)
  - url: http://localhost:5103
    description: Local web dev server; proxies /api to the API (same-origin cookies)
security:
  - sessionCookie: []
tags:
  - name: Health
    description: Liveness and readiness probes.
  - name: Auth
    description: Registration, sessions, CSRF.
  - name: Users & roles
    description: User management, roles, 3PL clients, audit log.
  - name: Topology
    description: Warehouses, zones and bins.
  - name: Catalogue
    description: SKUs, units-of-measure ladders, lots, serials.
  - name: Inventory
    description: Append-only movement ledger and on-hand projection.
  - name: Allocation
    description: FEFO / FIFO / LIFO reservation of stock against orders.
  - name: Inbound
    description: ASNs, receiving and quality inspection.
  - name: Putaway & slotting
    description: Directed putaway and velocity slotting.
  - name: Outbound
    description: Outbound orders and waves.
  - name: Picking
    description: Pick paths and pick tasks.
  - name: Packing & shipping
    description: Cartonization, pack stations, shipments, manifests, carrier rates.
  - name: Counting
    description: Cycle counting.
  - name: Replenishment
    description: Pick-face replenishment.
  - name: Returns
    description: Return authorisations and returns receiving.
  - name: Labels
    description: Barcodes and printable labels.
  - name: Reporting
    description: Dashboards, reports, notifications, billing, metrics.

paths:
  # ---------------------------------------------------------------- Health
  /api/v1/health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Liveness probe
      x-status: implemented
      x-ticket: SP-003
      security: []
      responses:
        '200':
          description: Process is up.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties: { data: { $ref: '#/components/schemas/Health' } }
  /api/v1/ready:
    get:
      tags: [Health]
      operationId: getReady
      summary: Readiness probe (database reachable and migrated)
      x-status: implemented
      x-ticket: SP-003
      security: []
      responses:
        '200':
          description: Database reachable; `migrations` is the number of applied migrations.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties: { data: { $ref: '#/components/schemas/Ready' } }
        '503':
          description: '`NOT_READY`: database unavailable or `schema_migrations` missing.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  # ---------------------------------------------------------------- Auth
  /api/v1/auth/register:
    post:
      tags: [Auth]
      operationId: registerOwner
      summary: Register an organisation and its owner account
      description: >-
        Always answers `202` with the same generic body whether or not the email is
        already registered, and never sets cookies, so the endpoint cannot be used to
        enumerate accounts. The caller signs in afterwards with `/auth/login`.
        Throttled per client IP (`REGISTER_IP_MAX_ATTEMPTS` per hour).
      x-status: implemented
      x-ticket: SP-010
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '202':
          description: Accepted (generic, non-enumerating).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties: { data: { $ref: '#/components/schemas/RegisterAccepted' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Sign in and receive session + CSRF cookies
      description: >-
        On success sets `sp_session` (HttpOnly, SameSite=Lax, Secure in production) and
        `sp_csrf` (readable by the SPA) and returns the CSRF token in the body. Failures
        answer `401 INVALID_CREDENTIALS` without saying whether the email exists.
        Throttled by a per-email progressive backoff, a per-IP failure window across all
        emails and a cap on distinct emails per client IP (`LOGIN_IP_MAX_EMAILS` per IPv4
        address or IPv6 /64, and 4x that per IPv6 /48). Attempts are reserved before any I/O, so a concurrent burst
        gets `429` as soon as the limit is reached.
      x-status: implemented
      x-ticket: SP-010
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Signed in.
          headers:
            Set-Cookie:
              description: '`sp_session=<token>; HttpOnly; SameSite=Lax; Path=/` and `sp_csrf=<token>; SameSite=Lax; Path=/`'
              schema: { type: string }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties: { data: { $ref: '#/components/schemas/LoginResult' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Sign out (deletes the server-side session)
      x-status: implemented
      x-ticket: SP-010
      x-permission: authenticated
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Session deleted; both cookies cleared.
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/auth/me:
    get:
      tags: [Auth]
      operationId: getMe
      summary: Current user, organisation and CSRF token
      x-status: implemented
      x-ticket: SP-010
      x-permission: authenticated
      responses:
        '200':
          description: The signed-in user.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties: { data: { $ref: '#/components/schemas/MeResult' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /api/v1/auth/verify-email:
    post:
      tags: [Auth]
      operationId: verifyEmail
      summary: Confirm an email address with a token delivered through the local outbox
      x-status: pending
      x-ticket: SP-009
      x-permission: authenticated
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyEmailRequest' }
      responses:
        '200':
          description: Email verified.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties: { data: { $ref: '#/components/schemas/VerifyEmailResult' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '501': { $ref: '#/components/responses/NotImplemented' }
  /api/v1/auth/password-reset:
    post:
      tags: [Auth]
      operationId: requestPasswordReset
      summary: Request or complete a password reset via the local outbox
      x-status: pending
      x-ticket: SP-017
      x-permission: authenticated
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetRequest' }
      responses:
        '202':
          description: Generic acknowledgement (does not reveal whether the email exists).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties: { data: { $ref: '#/components/schemas/RegisterAccepted' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '501': { $ref: '#/components/responses/NotImplemented' }

  # ---------------------------------------------------------------- Users & roles
  /api/v1/users:
    get:
      tags: [Users & roles]
      operationId: listUsers
      summary: List users of the organisation
      x-status: pending
      x-ticket: SP-015
      x-permission: authenticated
      responses:
        '200':
          description: Users.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      { data: { type: array, items: { $ref: '#/components/schemas/User' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '501': { $ref: '#/components/responses/NotImplemented' }
  /api/v1/users/invitations:
    post:
      tags: [Users & roles]
      operationId: inviteUser
      summary: Invite a user (invitation delivered through the local outbox)
      x-status: pending
      x-ticket: SP-015
      x-permission: authenticated
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvitationRequest' }
      responses:
        '201':
          description: Invitation created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties: { data: { $ref: '#/components/schemas/Invitation' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '501': { $ref: '#/components/responses/NotImplemented' }
  /api/v1/users/{userId}:
    patch:
      tags: [Users & roles]
      operationId: updateUser
      summary: Change a user's role or deactivate the user
      x-status: pending
      x-ticket: SP-015
      x-permission: authenticated
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserPatch' }
      responses:
        '200':
          description: Updated user.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties: { data: { $ref: '#/components/schemas/User' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '501': { $ref: '#/components/responses/NotImplemented' }
  /api/v1/roles:
    get:
      tags: [Users & roles]
      operationId: listRoles
      summary: List built-in and custom roles with their permissions
      x-status: pending
      x-ticket: SP-016
      x-permission: authenticated
      responses:
        '200':
          description: Roles.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      {
                        data:
                          { type: array, items: { $ref: '#/components/schemas/RoleDefinition' } },
                      }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '501': { $ref: '#/components/responses/NotImplemented' }
  /api/v1/clients:
    get:
      tags: [Users & roles]
      operationId: listClients
      summary: List 3PL client accounts
      x-status: pending
      x-ticket: SP-018
      x-permission: authenticated
      responses:
        '200':
          description: Clients.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      { data: { type: array, items: { $ref: '#/components/schemas/Client' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '501': { $ref: '#/components/responses/NotImplemented' }
  /api/v1/audit-events:
    get:
      tags: [Users & roles]
      operationId: listAuditEvents
      summary: Browse the audit log (keyset paginated)
      x-status: pending
      x-ticket: SP-019
      x-permission: authenticated
      parameters:
        - { name: before, in: query, required: false, schema: { type: integer, minimum: 1 } }
        - { name: action, in: query, required: false, schema: { type: string, maxLength: 64 } }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Audit events, newest first.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data: { type: array, items: { $ref: '#/components/schemas/AuditEvent' } }
                      meta: { $ref: '#/components/schemas/CursorMeta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '501': { $ref: '#/components/responses/NotImplemented' }

  # ---------------------------------------------------------------- Topology
  /api/v1/warehouses:
    get:
      tags: [Topology]
      operationId: listWarehouses
      summary: List warehouses (ordered by code)
      x-status: implemented
      x-ticket: SP-020
      x-permission: topology:read
      responses:
        '200':
          description: Warehouses of the caller's organisation.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      { data: { type: array, items: { $ref: '#/components/schemas/Warehouse' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Topology]
      operationId: createWarehouse
      summary: Create a warehouse
      description: >-
        `timezone` is canonicalised to its IANA name (e.g. `europe/london` is stored as
        `Europe/London`); unknown zones are rejected with `VALIDATION_FAILED`.
      x-status: implemented
      x-ticket: SP-020
      x-permission: topology:write
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateWarehouseRequest' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties: { data: { $ref: '#/components/schemas/Warehouse' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/warehouses/{warehouseId}:
    parameters:
      - $ref: '#/components/parameters/WarehouseIdPath'
    get:
      tags: [Topology]
      operationId: getWarehouse
      summary: Get one warehouse
      x-status: implemented
      x-ticket: SP-020
      x-permission: topology:read
      responses:
        '200':
          description: The warehouse.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties: { data: { $ref: '#/components/schemas/Warehouse' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Topology]
      operationId: updateWarehouse
      summary: Update or deactivate a warehouse
      x-status: pending
      x-ticket: SP-024
      x-permission: authenticated
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WarehousePatch' }
      responses:
        '200':
          description: Updated warehouse.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties: { data: { $ref: '#/components/schemas/Warehouse' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '501': { $ref: '#/components/responses/NotImplemented' }
  /api/v1/warehouses/{warehouseId}/zones:
    parameters:
      - $ref: '#/components/parameters/WarehouseIdPath'
    get:
      tags: [Topology]
      operationId: listZones
      summary: List zones of a warehouse (ordered by code)
      x-status: implemented
      x-ticket: SP-020
      x-permission: topology:read
      responses:
        '200':
          description: Zones.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      { data: { type: array, items: { $ref: '#/components/schemas/Zone' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Topology]
      operationId: createZone
      summary: Create a zone
      x-status: implemented
      x-ticket: SP-020
      x-permission: topology:write
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateZoneRequest' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties: { data: { $ref: '#/components/schemas/Zone' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/warehouses/{warehouseId}/bins:
    parameters:
      - $ref: '#/components/parameters/WarehouseIdPath'
    get:
      tags: [Topology]
      operationId: listBins
      summary: List bins in walk order (pick sequence, then code)
      x-status: implemented
      x-ticket: SP-020
      x-permission: topology:read
      parameters:
        - name: zoneId
          in: query
          required: false
          schema: { $ref: '#/components/schemas/Uuid' }
      responses:
        '200':
          description: Bins.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      { data: { type: array, items: { $ref: '#/components/schemas/Bin' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Topology]
      operationId: createBin
      summary: Create a bin
      description: >-
        `code` is parsed as `ZONE-AA-RR-L-P` (e.g. `A-03-12-2-B`) or a free-form staging
        code (`RCV01`, 2-16 characters, letter first) and stored upper-cased. When
        `pickSequence` is omitted it is derived from the address with a serpentine
        walk (odd aisles ascending, even aisles descending); free-form bins get 0.
        Invalid codes answer `400 INVALID_BIN_CODE`; an unknown zone answers `404`.
      x-status: implemented
      x-ticket: SP-020
      x-permission: topology:write
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBinRequest' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties: { data: { $ref: '#/components/schemas/Bin' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/warehouses/{warehouseId}/bins/{binId}:
    patch:
      tags: [Topology]
      operationId: updateBin
      summary: Update or deactivate a bin
      x-status: pending
      x-ticket: SP-024
      x-permission: authenticated
      parameters:
        - $ref: '#/components/parameters/WarehouseIdPath'
        - $ref: '#/components/parameters/BinIdPath'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BinPatch' }
      responses:
        '200':
          description: Updated bin.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties: { data: { $ref: '#/components/schemas/Bin' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '501': { $ref: '#/components/responses/NotImplemented' }
  /api/v1/warehouses/{warehouseId}/bins/import:
    post:
      tags: [Topology]
      operationId: importBins
      summary: Bulk-import zones and bins from CSV
      x-status: pending
      x-ticket: SP-021
      x-permission: authenticated
      parameters:
        - $ref: '#/components/parameters/WarehouseIdPath'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          text/csv:
            schema:
              type: string
              description: 'Header row `zone_code,bin_code,pick_sequence,max_weight_g,max_volume_cm3`.'
      responses:
        '200':
          description: Import report (all-or-nothing; rows with errors abort the import).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties: { data: { $ref: '#/components/schemas/ImportReport' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '501': { $ref: '#/components/responses/NotImplemented' }
  /api/v1/warehouses/{warehouseId}/map:
    get:
      tags: [Topology]
      operationId: getWarehouseMap
      summary: Warehouse layout for SVG map rendering
      x-status: pending
      x-ticket: SP-023
      x-permission: authenticated
      parameters:
        - $ref: '#/components/parameters/WarehouseIdPath'
      responses:
        '200':
          description: Layout.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties: { data: { $ref: '#/components/schemas/WarehouseMap' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '501': { $ref: '#/components/responses/NotImplemented' }

  # ---------------------------------------------------------------- Catalogue
  /api/v1/skus:
    get:
      tags: [Catalogue]
      operationId: listSkus
      summary: List SKUs (ordered by code, at most 200)
      x-status: implemented
      x-ticket: SP-030
      x-permission: catalog:read
      parameters:
        - name: search
          in: query
          required: false
          description: Case-insensitive substring match on code or description.
          schema: { type: string, minLength: 1, maxLength: 64 }
      responses:
        '200':
          description: SKUs.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      {
                        data:
                          {
                            type: array,
                            maxItems: 200,
                            items: { $ref: '#/components/schemas/Sku' },
                          },
                      }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Catalogue]
      operationId: createSku
      summary: Create a SKU with a nested unit-of-measure ladder
      description: >-
        Each level's factor must be a whole multiple (>= 2x) of the level below it
        (e.g. CS=12, PL=480). Bad ladders answer `400 INVALID_UOM_LADDER`.
        `expiryTracked` requires `lotTracked` (`400 VALIDATION_FAILED`).
      x-status: implemented
      x-ticket: SP-030
      x-permission: catalog:write
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSkuRequest' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties: { data: { $ref: '#/components/schemas/Sku' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
