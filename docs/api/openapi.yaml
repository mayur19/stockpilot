  # ---------------------------------------------------------------- Inventory
  /api/v1/inventory/receipts:
    post:
      tags: [Inventory]
      operationId: receiveStock
      summary: Receive stock into a bin (RECEIPT movement)
      description: >-
        `quantity` is a whole number in `uom` (default: the SKU's base unit) and is
        converted to base units with the SKU ladder. Lot-tracked SKUs require `lotCode`;
        expiry-tracked SKUs require `expiryDate`; untracked SKUs must omit both and get
        a system lot `AUTO-YYYYMMDD` (warehouse-local date). Receiving an existing lot
        with a different expiry answers `409 LOT_EXPIRY_MISMATCH`.
      x-status: implemented
      x-ticket: SP-040
      x-permission: inventory:receive
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReceiptRequest' }
      responses:
        '201':
          description: Movement appended and projection updated in one transaction.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties: { data: { $ref: '#/components/schemas/ReceiptResult' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ConcurrencyRetry' }
  /api/v1/inventory/moves:
    post:
      tags: [Inventory]
      operationId: moveStock
      summary: Move stock of one lot between two bins (MOVE movement)
      description: >-
        Only available (on hand minus allocated) units can leave the source bin;
        otherwise `409 INSUFFICIENT_AVAILABLE`. Source and destination must differ.
      x-status: implemented
      x-ticket: SP-040
      x-permission: inventory:move
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MoveRequest' }
      responses:
        '201':
          description: Movement appended; both affected balances returned.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties: { data: { $ref: '#/components/schemas/MoveResult' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ConcurrencyRetry' }
  /api/v1/inventory/adjustments:
    post:
      tags: [Inventory]
      operationId: adjustStock
      summary: Adjust stock with a reason code (ADJUST_IN / ADJUST_OUT movement)
      description: >-
        `delta` is a signed whole number of base units. Negative adjustments can only
        remove available units (`409 INSUFFICIENT_AVAILABLE`).
      x-status: implemented
      x-ticket: SP-040
      x-permission: inventory:adjust
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdjustmentRequest' }
      responses:
        '201':
          description: Movement appended.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties: { data: { $ref: '#/components/schemas/AdjustmentResult' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ConcurrencyRetry' }
  /api/v1/inventory/balances:
    get:
      tags: [Inventory]
      operationId: listBalances
      summary: Stock on hand by bin and lot (projection)
      description: Ordered by bin pick sequence, bin code, SKU code, expiry (nulls last), lot code.
      x-status: implemented
      x-ticket: SP-041
      x-permission: inventory:read
      parameters:
        - $ref: '#/components/parameters/WarehouseIdQuery'
        - { name: skuId, in: query, required: false, schema: { $ref: '#/components/schemas/Uuid' } }
        - { name: binId, in: query, required: false, schema: { $ref: '#/components/schemas/Uuid' } }
        - name: includeEmpty
          in: query
          required: false
          description: Include rows whose on-hand is zero.
          schema: { type: string, enum: ['true', 'false'], default: 'false' }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Balance rows.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
