          application/json:
            schema: { $ref: '#/components/schemas/BarcodeRequest' }
      responses:
        '200':
          description: SVG barcode.
          content:
            image/svg+xml:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '501': { $ref: '#/components/responses/NotImplemented' }

  # ---------------------------------------------------------------- Reporting
  /api/v1/dashboards/operations:
    get:
      tags: [Reporting]
      operationId: getOperationsDashboard
      summary: Throughput and backlog KPIs
      x-status: pending
      x-ticket: SP-170
      x-permission: authenticated
      parameters:
        - $ref: '#/components/parameters/WarehouseIdQuery'
      responses:
        '200':
          description: Dashboard tiles.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties: { data: { $ref: '#/components/schemas/OperationsDashboard' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
