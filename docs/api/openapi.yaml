        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/inventory/balances/as-of:
    get:
      tags: [Inventory]
      operationId: listBalancesAsOf
      summary: Point-in-time stock by ledger replay from the nearest snapshot
      x-status: pending
      x-ticket: SP-043
      x-permission: authenticated
      parameters:
        - $ref: '#/components/parameters/WarehouseIdQuery'
        - { name: at, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: skuId, in: query, required: false, schema: { $ref: '#/components/schemas/Uuid' } }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Balances as they were at `at`.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data: { type: array, items: { $ref: '#/components/schemas/BalanceRow' } }
                      meta:
                        type: object
                        properties:
                          at: { type: string, format: date-time }
                          replayedFromMovementId: { type: integer }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '501': { $ref: '#/components/responses/NotImplemented' }
  /api/v1/inventory/movements:
    get:
      tags: [Inventory]
      operationId: listMovements
      summary: Ledger entries, newest first, keyset paginated
      description: >-
        Pass `meta.nextCursor` from the previous page as `before` to get the next
        (older) page. `nextCursor` is null when the page was not full.
        `binId` matches either the source or the destination bin.
      x-status: implemented
      x-ticket: SP-040
      x-permission: inventory:read
      parameters:
        - $ref: '#/components/parameters/WarehouseIdQuery'
        - { name: skuId, in: query, required: false, schema: { $ref: '#/components/schemas/Uuid' } }
        - { name: binId, in: query, required: false, schema: { $ref: '#/components/schemas/Uuid' } }
        - name: before
          in: query
          required: false
          description: Return movements with `id` strictly less than this cursor.
          schema: { type: integer, minimum: 1 }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Movements.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Movement' } }
                      meta: { $ref: '#/components/schemas/CursorMeta' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/inventory/projection/verify:
    get:
      tags: [Inventory]
      operationId: verifyProjection
      summary: Replay the whole ledger and compare it with stored balances
      description: >-
        Organisation-wide. Folds every movement in id order with the shared domain
        `projectBalances` and diffs the result against `stock_balances`, ignoring rows
        that are zero on both sides. Read-only; it never repairs anything.
      x-status: implemented
      x-ticket: SP-041
      x-permission: inventory:verify
      responses:
        '200':
          description: Verification report.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties: { data: { $ref: '#/components/schemas/ProjectionReport' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/inventory/holds:
    post:
      tags: [Inventory]
      operationId: createHold
      summary: Place stock on hold (quarantine, damaged, QA)
      x-status: pending
      x-ticket: SP-042
      x-permission: authenticated
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HoldRequest' }
      responses:
        '201':
          description: Hold created; held units become unallocatable.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties: { data: { $ref: '#/components/schemas/Hold' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '501': { $ref: '#/components/responses/NotImplemented' }
  /api/v1/inventory/snapshots:
    post:
      tags: [Inventory]
      operationId: createSnapshot
      summary: Write a ledger snapshot used to bound replay cost
      x-status: pending
      x-ticket: SP-044
